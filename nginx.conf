server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # --- API reverse proxy -------------------------------------------------
    # The browser calls "/api/v1/...". nginx forwards the full URI unchanged to
    # the backend container ("ai-study-hub-api") over the shared Docker network
    # via BACKEND_API_URL (envsubst'd at container start). No CORS needed: the
    # hop is server-to-server.
    location /api/ {
        proxy_pass ${BACKEND_API_URL};
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming/SSE-friendly + long timeouts for AI chat & document jobs
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Document uploads can be large
        client_max_body_size 100m;
    }

    # --- SPA fallback ------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # gzip
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
}
