name: CI build & deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: # manual trigger (test before relying on push)

# Secrets are injected via GitHub Secrets — never inline them.
jobs:
  # --- CI build gate --------------------------------------------------------
  # Build the production bundle on every push/dispatch. The deploy job depends
  # on this, so a broken build never reaches the VPS.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # --- Deploy (only on main, only after build passes) -----------------------
  deploy:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialize deploys per branch so two rapid pushes never race on the same
    # .git / docker state. A running deploy is never canceled; a newer pending
    # deploy replaces an older pending one, so the latest commit lands last.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          # Fail the job on the first command that errors instead of masking
          # failures as a green check (the previous silent-success bug).
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            
            # Never let `set -e` abort silently — every failure path says why.
            fail() { echo "DEPLOY FAILED: $*" >&2; exit 1; }
            
            EXPECTED_SHA='${{ github.sha }}'
            PROJECT_DIR="$HOME/ai-study-hub-frontend"
            # Repo is public — clone/fetch anonymously. No token needed, which
            # removes a credential failure mode that previously aborted deploys.
            REPO_URL='https://github.com/${{ github.repository }}.git'
            
            echo "==> Deploying commit $EXPECTED_SHA"
            
            # --- Sync repo (clone once, then fetch + reset with retry) --------
            # The deploy used to die here with NO output: a transient fetch
            # error tripped `set -e` and the whole job showed a bare "exit 1".
            # Retry + an explicit message fix that.
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "==> Repository not found, cloning..."
              rm -rf "$PROJECT_DIR"
              mkdir -p "$PROJECT_DIR"
              cd "$PROJECT_DIR" || fail "cd into $PROJECT_DIR failed"
              git clone -b main "$REPO_URL" . || fail "git clone failed"
            else
              echo "==> Repository found, updating..."
              cd "$PROJECT_DIR" || fail "cd into $PROJECT_DIR failed"
              git remote set-url origin "$REPO_URL"
              fetched=0
              for attempt in 1 2 3; do
                echo "==> git fetch (attempt $attempt/3)..."
                if git fetch --all --prune; then fetched=1; break; fi
                [ "$attempt" -lt 3 ] && sleep 5
              done
              [ "$fetched" = "1" ] || fail "git fetch failed after 3 attempts"
              git reset --hard origin/main || fail "git reset --hard origin/main failed"
            fi
            
            # --- Verify the code actually landed on the VPS -------------------
            ACTUAL_SHA="$(git rev-parse HEAD)"
            echo "==> Triggered commit : $EXPECTED_SHA"
            echo "==> VPS HEAD commit  : $ACTUAL_SHA"
            [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ] || fail "VPS HEAD ($ACTUAL_SHA) != triggered commit ($EXPECTED_SHA) — code did not land"
            echo "==> VPS is at the expected commit."
            
            # --- Rebuild & restart --------------------------------------------
            docker network inspect ai-study-hub-network >/dev/null 2>&1 || docker network create ai-study-hub-network
            echo "==> Rebuilding & restarting containers..."
            docker compose down || fail "docker compose down failed"
            docker compose up --build -d || fail "docker compose up --build -d failed"
            
            # --- Health check (lenient: ~2 min window) -----------------------
            # The old 30s window produced false-negatives: the deploy landed
            # and nginx was fine, but a slow cold-start under VPS load made the
            # job report failure. Poll longer and bound each curl.
            echo "==> Waiting for frontend to serve HTTP 200..."
            CODE="000"
            for i in $(seq 1 60); do
              CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:8081/ || true)"
              if [ "$CODE" = "200" ]; then
                echo "==> Frontend healthy (HTTP 200) after ~$((i*2))s."
                exit 0
              fi
              sleep 2
            done
            echo "DEPLOY FAILED: frontend did not return HTTP 200 within ~120s (last code: $CODE)." >&2
            echo "--- recent container logs ---" >&2
            docker compose logs --tail=50 >&2 || true
            exit 1
