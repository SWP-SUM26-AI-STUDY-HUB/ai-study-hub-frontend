name: CI build & deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: # manual trigger (test before relying on push)

# Secrets are injected via GitHub Secrets — never inline them.
jobs:
  # --- CI build gate --------------------------------------------------------
  # Build the production bundle on every push/dispatch. The deploy job depends
  # on this, so a broken build never reaches the VPS.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # --- Deploy (only on main, only after build passes) -----------------------
  deploy:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          # Fail the job on the first command that errors instead of masking
          # failures as a green check (the previous silent-success bug).
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail

            EXPECTED_SHA='${{ github.sha }}'
            PROJECT_DIR="$HOME/ai-study-hub-frontend"

            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "==> Repository not found, cloning..."
              rm -rf "$PROJECT_DIR"
              mkdir -p "$PROJECT_DIR"
              cd "$PROJECT_DIR"
              git clone -b main https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
            else
              echo "==> Repository found, updating..."
              cd "$PROJECT_DIR"
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git fetch --all --prune
              git reset --hard origin/main
            fi

            # --- Verify the code actually landed on the VPS ---------------------
            # Previously the job reported success while the VPS stayed 20 commits
            # behind, because nothing checked the result. This guard fails loudly.
            ACTUAL_SHA="$(git rev-parse HEAD)"
            echo "==> Triggered commit : $EXPECTED_SHA"
            echo "==> VPS HEAD commit  : $ACTUAL_SHA"
            if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
              echo "ERROR: VPS HEAD ($ACTUAL_SHA) != triggered commit ($EXPECTED_SHA). Deploy did not land!"
              exit 1
            fi
            echo "==> VPS is at the expected commit."

            # --- Rebuild & restart ----------------------------------------------
            docker network inspect ai-study-hub-network >/dev/null 2>&1 || docker network create ai-study-hub-network
            echo "==> Rebuilding & restarting containers..."
            docker compose down
            docker compose up --build -d

            # --- Health check ---------------------------------------------------
            echo "==> Waiting for frontend to serve HTTP 200..."
            CODE="000"
            for i in $(seq 1 30); do
              CODE="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/ || true)"
              if [ "$CODE" = "200" ]; then
                echo "==> Frontend healthy (HTTP 200) after ${i}s."
                exit 0
              fi
              sleep 1
            done
            echo "ERROR: frontend did not return HTTP 200 (got $CODE). Recent logs:"
            docker compose logs --tail=50
            exit 1
