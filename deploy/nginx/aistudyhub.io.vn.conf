# =============================================================================
#  AI Study Hub Frontend — HOST nginx (reverse proxy + SSL termination)
# -----------------------------------------------------------------------------
#  VPS path:  /etc/nginx/sites-available/aistudyhub.io.vn.conf
#             -> symlink: /etc/nginx/sites-enabled/aistudyhub.io.vn.conf
#  (sites-enabled/* is included inside nginx's `http {}` block, so the `map`
#   directive below is valid at this file's top level.)
#
#  Flow:  Internet -> host nginx (:80 -> :443 SSL)
#                 -> frontend container (127.0.0.1:8081)
#                 -> container nginx (SPA + /api proxy -> ai-study-hub-api:8080)
#
#  Canonical:  https://aistudyhub.io.vn   (www -> root 301 redirect)
# =============================================================================

# WebSocket / future-realtime Connection header (http-level; safe, no-op for SSE)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- HTTP: Let's Encrypt challenge + force HTTPS at canonical root -----------
server {
    listen 80;
    listen [::]:80;
    server_name aistudyhub.io.vn www.aistudyhub.io.vn;

    # certbot --webroot -w /var/www/certbot  (issue + auto-renew)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Strip www AND force HTTPS in one hop
    location / {
        return 301 https://aistudyhub.io.vn$request_uri;
    }
}

# --- HTTPS: www -> root redirect --------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.aistudyhub.io.vn;

    ssl_certificate     /etc/letsencrypt/live/aistudyhub.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aistudyhub.io.vn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://aistudyhub.io.vn$request_uri;
}

# --- HTTPS: canonical site (proxy to frontend container) --------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aistudyhub.io.vn;

    ssl_certificate     /etc/letsencrypt/live/aistudyhub.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aistudyhub.io.vn/privkey.pem;

    # Modern TLS + session resumption
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                              always;
    add_header X-Frame-Options           SAMEORIGIN                           always;
    add_header Referrer-Policy           strict-origin-when-cross-origin     always;

    # Match backend document-upload limit (container nginx also sets 100m)
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / future realtime (no-op for current SSE-based AI chat)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE/streaming friendly + long timeouts for AI chat & document jobs
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
